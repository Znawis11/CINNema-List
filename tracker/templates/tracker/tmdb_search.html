{% extends 'base.html' %}
{% block content %}
<h2>Поиск фильмов и сериалов</h2>
<p class="text-muted">Найдите фильм в базе TMDB — он появится в вашей коллекции с постером, тегами и рейтингами.</p>
<input name="q" value="{{ q }}" class="form-control mb-4" autofocus
       placeholder="Например: Интерстеллар"
       hx-get="{% url 'tmdb_results' %}"
       hx-trigger="keyup changed delay:500ms"
       hx-target="#tmdb-results">
<div id="tmdb-results"></div>
{% endblock %}
