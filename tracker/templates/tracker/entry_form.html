{% extends 'base.html' %}
{% block content %}
<h2>{{ heading }}</h2>
<form method="post" class="mb-5">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Сохранить</button>
  {% if form.instance.pk %}
    <a href="{% url 'entry_detail' form.instance.pk %}" class="btn btn-secondary">Отмена</a>
  {% else %}
    <a href="{% url 'entry_list' %}" class="btn btn-secondary">Отмена</a>
  {% endif %}
</form>
{% endblock %}
