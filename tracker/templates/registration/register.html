{% extends 'base.html' %}
{% block content %}
<div class="col-md-5 mx-auto">
  <div class="card">
    <div class="card-body p-4">
      <h2 class="mb-3">Регистрация</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100">Создать аккаунт</button>
        <div class="text-center mt-3">
          <a href="{% url 'login' %}">Уже есть аккаунт</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
