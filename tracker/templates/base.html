<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КиноТрекер</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">КиноТрекер</a>
    {% if user.is_authenticated %}
      <a class="btn btn-outline-warning btn-sm me-auto ms-3" href="{% url 'library_page' %}">📁 Мои папки</a>
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm">Выйти ({{ user.username }})</button>
      </form>
    {% endif %}
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
