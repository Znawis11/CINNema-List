<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КиноТрекер</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { min-height: 100vh; }
    .navbar .nav-link:hover { color: #ffc107; }

    /* постеры */
    .poster { aspect-ratio: 2 / 3; object-fit: cover; width: 100%;
              background: #212529; border-radius: .25rem; }
    .poster-ph { aspect-ratio: 2 / 3; width: 100%; background: #343a40;
                 border-radius: .25rem; display: flex; align-items: center;
                 justify-content: center; color: #6c757d; font-size: .8rem; }

    /* карточки */
    .card { transition: transform .12s ease, box-shadow .12s ease; }
    .hover-card:hover { transform: translateY(-3px);
                        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }

    /* строка «Популярное сейчас» */
    .popular-row { display: flex; gap: .8rem; overflow-x: auto;
                   padding: .25rem .25rem 1rem; scroll-snap-type: x proximity; }
    .popular-row .pop-card { flex: 0 0 138px; scroll-snap-align: start; text-decoration: none; }
    .popular-row::-webkit-scrollbar { height: 8px; }
    .popular-row::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 4px; }

    /* чипы-фильтры */
    .filter-chip input { position: absolute; opacity: 0; }
    .filter-chip span { display: inline-block; padding: .25rem .7rem; font-size: .85rem;
                        border: 1px solid #ced4da; border-radius: 999px;
                        background: #fff; cursor: pointer; user-select: none; }
    .filter-chip input:checked + span { background: #0d6efd; border-color: #0d6efd; color: #fff; }
    .filter-chip input:focus + span { box-shadow: 0 0 0 .2rem rgba(13,110,253,.25); }

    /* карточки рейтингов */
    .rating-card .value { font-size: 1.4rem; font-weight: 600; line-height: 1.2; }
    .rating-card .label { font-size: .78rem; opacity: .85; }

    /* аватар (первая буква имени) */
    .avatar-circle { width: 32px; height: 32px; border-radius: 50%;
                     background: #0d6efd; color: #fff; font-weight: 600;
                     display: inline-flex; align-items: center;
                     justify-content: center; flex: 0 0 auto; }
    .avatar-lg { width: 72px; height: 72px; font-size: 1.8rem; }
    .navbar-username { color: #fff; }
    a:hover .navbar-username { color: #ffc107; }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">🎬 КиноТрекер</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
            aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      {% if user.is_authenticated %}
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'entry_list' %}active{% endif %}" href="{% url 'entry_list' %}">Коллекция</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'tmdb_page' %}active{% endif %}" href="{% url 'tmdb_page' %}">Поиск фильмов</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="{% url 'profile' %}" class="d-flex align-items-center gap-2 text-decoration-none"
             title="Профиль и статистика">
            <span class="avatar-circle">{{ user.username|first|upper }}</span>
            <span class="navbar-username">{{ user.username }}</span>
          </a>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button class="btn btn-outline-warning btn-sm">Выйти</button>
          </form>
        </div>
      {% else %}
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Вход</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
        </ul>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<input type="file" id="fileDialogInput" accept=".mp4,.mkv,.avi,video/*" class="d-none">
<script>
// Системный диалог выбора файла: браузер не отдаёт серверу путь к файлу,
// поэтому шлём имя и размер — сервер сам найдёт файл на диске и привяжет.
function fileDialog(btn, season, number, action) {
  const wrap = btn.closest('.file-dialog');
  let input = wrap && wrap.querySelector('input[type=file]');
  // кнопки вне .file-dialog (например, серия в плеере) используют скрытый общий input
  if (!input) {
    input = document.getElementById('fileDialogInput');
    if (!input) return;
  }
  input.value = '';
  input.onchange = () => {
    const f = input.files && input.files[0];
    if (!f) return;
    const body = new URLSearchParams({ name: f.name, size: String(f.size) });
    const s = season || input.dataset.season;
    const n = number || input.dataset.number;
    if (s) body.set('season', s);
    if (n) body.set('number', n);
    const url = action || input.dataset.action;
    if (!url) return;
    const csrf = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';
    const label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '⏳ Ищу файл…';
    fetch(url, {
      method: 'POST',
      headers: { 'X-CSRFToken': csrf },
      body: body,
      redirect: 'follow',
    })
      .then(r => { window.location = r.url || '/'; })
      .catch(() => {
        btn.disabled = false;
        btn.innerHTML = label;
        alert('Не получилось найти файл. Попробуйте выбрать его по папкам.');
      });
  };
  input.click();
}
</script>
</body>
</html>
